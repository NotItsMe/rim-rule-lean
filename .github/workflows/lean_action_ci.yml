name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # The template's `leanprover-community/docgen-action@v1` step was removed: it builds
      # HTML docs for all of mathlib and ran out of memory on the runner. The repo is
      # private with GitHub Pages off, so the docs had nowhere to deploy anyway.
